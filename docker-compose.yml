# Local demo dependencies only. No real money and no real customer data.
# SQL Server Developer is the default edition of this image; MSSQL_PID makes that explicit.
# The SA password is a local demo password. Override it with MSSQL_SA_PASSWORD.
# Redpanda broker flags and image tag are copied from Redpanda's single-broker lab:
# https://docs.redpanda.com/redpanda-labs/docker-compose/single-broker/

name: ledgerlite

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ledgerlite-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LedgerLite_Dev1!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    container_name: redpanda-0
    hostname: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

volumes:
  sqlserver-data:
  redpanda-data:
