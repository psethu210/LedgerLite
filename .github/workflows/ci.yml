name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore LedgerLite.sln
      - run: dotnet build LedgerLite.sln --no-restore --configuration Release
      - run: dotnet test LedgerLite.sln --no-build --configuration Release
